name: Windows Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:platform
      - run: npm run smoke
      - name: Package Windows beta
        run: npm run build:installer
      - name: Verify installer
        run: |
          $installer = Get-ChildItem release -Filter 'CatCode-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced' }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: CatCode-Windows-beta-x64
          path: desktop/release/CatCode-*.exe
          if-no-files-found: error
          retention-days: 14
