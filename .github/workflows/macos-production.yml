name: macOS Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Signed and notarized ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: desktop
    env:
      npm_config_platform: darwin
      npm_config_arch: ${{ matrix.arch }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Restore App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [[ -z "$APPLE_API_KEY_BASE64" ]]; then
            echo "APPLE_API_KEY_BASE64 is missing." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          node -e "require('node:fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'), { mode: 0o600 })" "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/verify-macos-signing-env.js
      - name: Build, sign, and notarize
        run: npm run build:mac:release:${{ matrix.arch }}
      - name: Verify architecture, signature, Gatekeeper, and notarization ticket
        run: |
          app_path="$(find release -type d -name CatCode.app -print -quit)"
          bash scripts/verify-macos-artifact.sh "$app_path" "${{ matrix.arch }}" signed
      - name: Remove temporary API key
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$APPLE_API_KEY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CatCode-macOS-production-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 30
