services:
  caddy:
    image: caddy:2.11.4-alpine
    env_file: .env
    restart: unless-stopped
    depends_on:
      license-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  license-api:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  license-migrate:
    build: .
    env_file:
      - path: .migration.env
        required: false
    profiles: ["maintenance"]
    command: ["node", "scripts/migrate.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  license-admin:
    build: .
    env_file:
      - path: .admin.env
        required: false
    profiles: ["maintenance"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  caddy_data:
  caddy_config:
