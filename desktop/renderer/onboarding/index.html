<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'">
    <title>CatCode</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="tour" data-scene="hello">
      <header class="topbar">
        <div class="brand"><img src="../../assets/catcode-v6-logo.png" alt=""><span>CatCode</span></div>
        <div class="progress" aria-label="Progress"><span id="step-count"></span><div class="progress-track"><i id="progress-fill"></i></div></div>
        <button class="quiet" id="skip" type="button"></button>
      </header>
      <section class="stage" aria-live="polite">
        <div class="demo-bubble" id="demo-bubble"></div>
        <img id="demo-cat" class="demo-cat" src="../pet/assets/v6/idle-master.png" alt="">
        <div class="demo-water" aria-hidden="true"></div>
        <div class="demo-clock" aria-hidden="true"></div>
        <div class="demo-note" aria-hidden="true"></div>
        <div class="demo-cursor" aria-hidden="true"></div>
        <div class="demo-music" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="demo-screen" aria-hidden="true"><i></i></div>
        <div class="demo-palette" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="demo-agent" aria-hidden="true"><span></span><span></span><b></b></div>
      </section>
      <section class="content">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="description" id="description"></p>
        <ul id="details"></ul>
        <div class="state-controls" id="state-controls"></div>
        <button class="action" id="action" type="button" hidden></button>
      </section>
      <footer class="controls">
        <button class="secondary" id="back" type="button"></button>
        <div class="dots" id="dots" aria-label="Tour steps"></div>
        <button class="primary" id="next" type="button"></button>
      </footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
